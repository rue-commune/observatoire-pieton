name: Test

# Runs the same gate as `./docker/docker-manage.sh test`: strict Hugo
# render, data generator unit tests, black and flake8.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

# The job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the test gate
        run: ./docker/docker-manage.sh test
