# Provisional: set to the production domain once known. The page itself
# uses no absolute URLs, so the value does not affect it.
baseURL = "https://observatoire-pieton.pages.dev/"
locale = "fr"
title = "Observatoire piéton"

# The site is a single self-contained page for now.
disableKinds = ["taxonomy", "term", "section", "page", "RSS", "sitemap", "404"]

defaultContentLanguage = "fr"
# Keep the page diffable against the original standalone file.
disableHugoGeneratorInject = true

# Publisher, shown in the header, footer and credits for every city.
[params.editeur]
  nom = "Rue Commune"
  url = "https://www.rue-commune.org/"
  mentions = "https://www.rue-commune.org/mentions-legales/"

# The observatory's concept and original code were kindly contributed by
# Collectif Paris Piétons; keep crediting them in the footer and credits.
[params.origine]
  nom = "Collectif Paris Piétons"
  url = "https://parispietons.fr/"
